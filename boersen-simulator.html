<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Börsen-Simulator</title>
<style>
:root{
  --bg:#FFFFFF; --panel:#F1F3F5; --line:#DDE2E6; --ink:#14202B; --muted:#5A6672;
  --capital:#1F5C8B; --gain:#2E7D5B; --loss:#A6392B;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-variant-numeric:tabular-nums;line-height:1.5}
.app{max-width:1180px;margin:0 auto;padding:20px 18px 60px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
header h1{font-size:22px;margin:0 0 2px}
header p{margin:0;color:var(--muted);font-size:13px;max-width:52ch}
.seedbox{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.seedbox input{width:96px;padding:4px 6px;border:1px solid var(--line);background:#fff}
.seedbox button,.btn,.lnk{font:inherit;font-size:12px;border:1px solid var(--line);background:#fff;
  color:var(--ink);padding:4px 10px;cursor:pointer}
.lnk{border:none;color:var(--capital);padding:0;text-decoration:underline}
.btn{padding:8px 14px;font-size:13px;background:var(--capital);color:#fff;border:none}
.tabs{display:flex;gap:2px;margin:18px 0 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{font:inherit;font-size:13px;background:none;border:none;border-bottom:2px solid transparent;
  padding:9px 14px;cursor:pointer;color:var(--muted)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--capital);font-weight:600}
.layout{display:grid;grid-template-columns:300px 1fr;gap:26px;margin-top:18px;align-items:start}
aside{background:var(--panel);padding:4px 14px 14px;border:1px solid var(--line)}
main{position:relative;min-height:400px}
main.busy{opacity:.55;transition:opacity .15s}
.bar{position:absolute;top:0;left:0;right:0;height:2px;background:#E2E7EB;z-index:2;overflow:hidden}
.bar i{display:block;height:100%;width:35%;background:var(--capital);animation:sl 1s linear infinite}
@keyframes sl{from{transform:translateX(-100%)}to{transform:translateX(330%)}}
.grp{margin:16px 0}
.grp h3{font-size:12px;text-transform:none;letter-spacing:0;margin:0 0 8px;
  display:flex;justify-content:space-between;align-items:baseline;font-weight:700}
.fld{display:block;margin:0 0 11px;font-size:12px}
.fld-lab{display:flex;justify-content:space-between;gap:8px;color:var(--muted);margin-bottom:2px}
.fld-lab b{color:var(--ink)}
.fld-row{display:flex;gap:6px;align-items:center}
.fld-row input[type=range]{flex:1;min-width:0;accent-color:var(--capital)}
.fld-row input[type=number]{width:66px;padding:3px 5px;border:1px solid var(--line);background:#fff;font:inherit;font-size:12px}
.hint{color:var(--muted);font-size:11px}
.seg{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}
.seg button{font:inherit;font-size:11px;padding:4px 8px;border:1px solid var(--line);background:#fff;cursor:pointer}
.seg button.on{background:var(--capital);color:#fff;border-color:var(--capital)}
.alloc-row{display:grid;grid-template-columns:1fr 84px 38px;gap:6px;align-items:center;font-size:12px;
  color:var(--muted);padding:1px 0}
.alloc-row.active{color:var(--ink);font-weight:600}
.alloc-row input{accent-color:var(--capital);min-width:0}
.alloc-row b{text-align:right;font-weight:600}
.warn{color:var(--loss);font-size:12px}
h2{font-size:15px;margin:22px 0 8px}
.chartHead{display:flex;justify-content:space-between;align-items:baseline}
.chartHead h2{margin-top:0}
.cap{font-size:12px;color:var(--muted);margin:6px 0 0;max-width:76ch}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);margin:16px 0}
.kpi{background:#fff;padding:9px 11px;display:flex;flex-direction:column;gap:1px}
.kpi span{font-size:11px;color:var(--muted)}
.kpi strong{font-size:16px;font-weight:600}
.kpi em{font-size:11px;color:var(--muted);font-style:normal}
.doc{max-width:74ch;margin-top:18px}
.doc h3{font-size:13px;margin:18px 0 4px}
.doc p,.doc li{font-size:13px;color:#2A3641}
.loading{color:var(--muted);font-size:13px}
footer{margin-top:34px;padding-top:12px;border-top:1px solid var(--line);color:var(--muted);font-size:11px}
@media (max-width:860px){.layout{grid-template-columns:1fr}aside{order:2}}
@media (prefers-reduced-motion:reduce){.bar i{animation:none;width:100%}}

/* --- Tab "Erklärungen" ------------------------------------------------- */
.doc-wide{max-width:86ch}
.erk-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.erk-head h2{margin-top:0}
.erk{margin:0 0 14px;padding:0 0 0 12px;border-left:2px solid var(--line)}
.erk h4{font-size:13px;margin:0 0 2px;font-weight:600}
.erk-simpel{font-size:13px;color:#2A3641;margin:0}
.erk-detail{margin:6px 0 0;padding:8px 10px;background:var(--panel);border-left:2px solid var(--capital);
  font-size:12px;color:#3A4753}
.erk-detail>span{display:block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);margin-bottom:3px;font-weight:700}
.erk-detail p{font-size:12px;margin:0 0 6px}
.erk-detail p:last-child{margin-bottom:0}
.erk-detail code{font-size:11px;background:#fff;padding:0 3px;border:1px solid var(--line)}
.gloss{display:grid;grid-template-columns:minmax(140px,auto) 1fr;gap:4px 14px;font-size:13px;margin:8px 0 0}
.gloss dt{font-weight:600}
.gloss dd{margin:0;color:#2A3641}
.prov{font-size:11px;color:var(--muted);max-width:none}
@media (max-width:600px){.gloss{grid-template-columns:1fr;gap:1px 0}.gloss dd{margin:0 0 8px}}

</style>
</head>

<div id="root"></div>
