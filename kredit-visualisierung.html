<!-- === CONTEXT ===
Purpose:     Self-contained, publishable build of the Kredit-Visualisierung React component.
             One file, no network access needed at runtime, no build step for the reader.
Decisions:   - React 18, ReactDOM, Recharts 2 and the component are pre-bundled with esbuild and
               inlined. This replaces the earlier in-browser Babel + import-map approach, which
               loaded React from esm.sh and Recharts as a separate esm.sh graph: two React copies
               could be resolved at runtime, which breaks hooks and leaves the page blank.
             - Tailwind classes were compiled ahead of time with the Tailwind CLI against the
               component source, so only the ~50 utilities actually used are inlined. The Play CDN
               is gone; nothing is fetched at load time.
             - Rejected: shipping separate .js/.css files. A single HTML file survives being
               emailed, dropped in a Git repo, or opened from disk without a server.
Rebuild:     npm i react@18 react-dom@18 recharts@2 esbuild tailwindcss@3
             npx tailwindcss -i input.css -o dist.css --minify
             npx esbuild src/main.jsx --bundle --minify --jsx=automatic \
               --define:process.env.NODE_ENV='"production"' --outfile=dist.js
             then inline dist.css into <style> and dist.js into <script>.
Limitations: ~570 kB, almost all of it React + Recharts. Versions are frozen at build time —
             rerun the commands above to pick up upstream fixes.
=== END CONTEXT === -->
